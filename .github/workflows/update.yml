name: Update Election Results

on:
  push:
    branches:
      - main
    paths:
      - "config/elections.json"
  workflow_dispatch:
    inputs:
      include_all:
        description: "active=false の選挙も再取得する (true/false)"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: election-tracker-update
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Collect election results
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.include_all }}" = "true" ]; then
            node scripts/collect.mjs --all
          else
            node scripts/collect.mjs
          fi

      - name: Commit updated data if changed
        run: |
          git config user.name "election-tracker-bot"
          git config user.email "actions@github.com"
          if git diff --quiet docs/data/latest.json; then
            echo "No changes in latest.json"
            exit 0
          fi
          git add docs/data/latest.json
          git commit -m "chore: update election results ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git push
